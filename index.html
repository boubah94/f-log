<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F-Log</title>
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F-Log">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: #101014; color: #e8e8ec;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
}
header {
  padding: 14px 16px 10px; text-align: center;
  border-bottom: 1px solid #2a2a35;
}
header h1 { font-size: 1.3rem; letter-spacing: .5px; }
header p { color: #9a9aa5; font-size: .75rem; margin-top: 2px; }
main { flex: 1; position: relative; min-height: 0; }
iframe {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; background: #101014; display: none;
}
iframe.active { display: block; }
nav {
  display: flex; border-top: 1px solid #2a2a35;
  background: #16161c;
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; background: none; border: 0; color: #9a9aa5;
  font-size: .85rem; font-weight: 600; padding: 14px 0 12px;
  cursor: pointer; font-family: inherit;
}
nav button .ico { font-size: 1.3rem; display: block; margin-bottom: 2px; }
nav button.active { color: #ff5d5d; }
</style>
</head>
<body>
<header>
  <h1>&#x1F4AA; F-Log</h1>
  <p>SNIPER&rsquo;s fitness hub</p>
</header>
<main>
  <iframe id="fW" class="active" src="https://boubah94.github.io/w-log-dashboard/" title="w-log"></iframe>
  <iframe id="fR" src="https://boubah94.github.io/r-log-dashboard/" title="r-log" loading="lazy"></iframe>
  <iframe id="fO" src="overall.html" title="overall" loading="lazy"></iframe>
</main>
<nav>
  <button id="tW" class="active" onclick="show('W')"><span class="ico">&#x1F4AA;</span>W-Log</button>
  <button id="tR" onclick="show('R')"><span class="ico">&#x1F3C3;</span>R-Log</button>
  <button id="tO" onclick="show('O')"><span class="ico">&#x1FAC0;</span>Overall</button>
</nav>
<script>
function show(which) {
  const ids = { W: ['fW', 'tW'], R: ['fR', 'tR'], O: ['fO', 'tO'] };
  for (const k in ids) {
    const on = k === which;
    document.getElementById(ids[k][0]).classList.toggle('active', on);
    document.getElementById(ids[k][1]).classList.toggle('active', on);
  }
  try { localStorage.setItem('flog-tab', which); } catch (e) {}
}
try {
  const saved = localStorage.getItem('flog-tab');
  if (saved === 'R' || saved === 'O') show(saved);
} catch (e) {}
</script>
</body>
</html>
