<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F-Log</title>
<meta name="theme-color" content="#08080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F-Log">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: #08080b; color: #ece9e2;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
}
header {
  padding: 14px 16px 11px; text-align: center;
  border-bottom: 1px solid #262633;
  background: linear-gradient(180deg, #0d0d13, #08080b);
}
header h1 { font-size: 1.25rem; letter-spacing: 3.5px; font-weight: 800; }
header h1 .bat { letter-spacing: 0; }
header p { color: #8f8f9a; font-size: .72rem; margin-top: 3px; letter-spacing: 1.6px; text-transform: uppercase; }
main { flex: 1; position: relative; min-height: 0; }
iframe {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; background: #08080b; display: none;
}
iframe.active { display: block; }
nav {
  display: flex; border-top: 1px solid #262633;
  background: #0c0c11;
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; background: none; border: 0; color: #8f8f9a;
  font-size: .85rem; font-weight: 600; padding: 14px 0 12px;
  cursor: pointer; font-family: inherit;
}
nav button .ico { font-size: 1.3rem; display: block; margin-bottom: 2px; }
nav button.active { color: #f5b921; }
</style>
</head>
<body>
<header>
  <h1><span class="bat">🦇</span> F-LOG</h1>
  <p>Sniper&rsquo;s fitness cave</p>
</header>
<main>
  <iframe id="fO" class="active" src="overall.html" title="overall"></iframe>
  <iframe id="fW" src="https://boubah94.github.io/w-log-dashboard/" title="w-log" loading="lazy"></iframe>
  <iframe id="fR" src="https://boubah94.github.io/r-log-dashboard/" title="r-log" loading="lazy"></iframe>
</main>
<nav>
  <button id="tO" class="active" onclick="show('O')"><span class="ico">&#x1FAC0;</span>Overall</button>
  <button id="tW" onclick="show('W')"><span class="ico">&#x1F4AA;</span>W-Log</button>
  <button id="tR" onclick="show('R')"><span class="ico">&#x1F3C3;</span>R-Log</button>
</nav>
<script>
function show(which) {
  const ids = { O: ['fO', 'tO'], W: ['fW', 'tW'], R: ['fR', 'tR'] };
  for (const k in ids) {
    const on = k === which;
    document.getElementById(ids[k][0]).classList.toggle('active', on);
    document.getElementById(ids[k][1]).classList.toggle('active', on);
  }
}
</script>
</body>
</html>
